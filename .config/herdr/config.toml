onboarding = false

[ui.sound]
enabled = false

# Key bindings ported from ~/.tmux.conf (prefix `, tmux defaults,
# pain-control and sessionist). Press ` twice to type a literal backtick.
[keys]
prefix = "backtick"
extra_prefixes = ["ctrl+b"]  # tmux prefix2

# tmux: | splits side by side, - and _ split top/bottom
split_vertical = ["prefix+|", "prefix+backslash"]
split_horizontal = ["prefix+minus", "prefix+_"]
close_pane = "prefix+x"
zoom = "prefix+z"

# tmux: arrows (your vim-aware binds) and h/j/k/l (pain-control) move between panes
focus_pane_left = ["prefix+left", "prefix+h"]
focus_pane_down = ["prefix+down", "prefix+j"]
focus_pane_up = ["prefix+up", "prefix+k"]
focus_pane_right = ["prefix+right", "prefix+l"]
cycle_pane_next = "prefix+o"
last_pane = "prefix+;"
# pain-control: H/J/K/L resize
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# tmux windows -> herdr tabs
new_tab = "prefix+c"
next_tab = ["prefix+]", "prefix+n"]
previous_tab = ["prefix+[", "prefix+p"]
rename_tab = "prefix+,"
close_tab = "prefix+&"
switch_tab = "prefix+1..9"

# tmux sessions -> herdr workspaces
workspace_picker = ["prefix+s", "prefix+w"]
rename_workspace = ["prefix+.", "prefix+$"]
new_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+x"
previous_workspace = ["prefix+(", "prefix+{"]
next_workspace = ["prefix+)", "prefix+}"]
goto = "prefix+g"

detach = "prefix+d"
edit_scrollback = "prefix+y"
settings = "prefix+shift+s"

# Colours ported from ~/.tmux/vimline.tmux.conf (tmuxline/airline style):
# colour233 bar, colour236 current window, colour247/231 text,
# colour148 green badge, colour236 inactive pane borders.
[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "#121212"     # colour233 status bar
surface_dim = "#1c1c1c"
surface0 = "#121212"       # colour233 inactive window bg
surface1 = "#3a3a3a"
active_row_bg = "#303030"  # colour236 current window
selection_bg = "#303030"
overlay0 = "#121212"       # inactive pane borders, kept darker than the active one
overlay1 = "#ffffff"       # colour231 inactive window text, status-right text
subtext0 = "#9e9e9e"       # colour247
text = "#ffffff"           # colour231
accent = "#303030"         # colour236 current window bg (also the active pane border)
green = "#afd700"
teal = "#005f5f"           # tmux.conf active pane border

[ui]
accent = "#afd700"
pane_outer_borders = false # tmux-style internal splitters only
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = "herdr workspace list | jq -r '.result.workspaces[] | select(.focused) | .label'", interval_seconds = 2, timeout_seconds = 2 },  # tmux #S
  { type = "datetime", format = "%Y-%m-%d  %H:%M" },
  { type = "command", command = "hostname -s", interval_seconds = 3600 },  # tmux #h
]
tab_bar_right_separator = "  "
window_title = "{workspace}"  # tmux set-titles-string "#S"
