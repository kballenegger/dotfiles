# Channel Routes — workspace-side per-channel metadata. NOT read by the gateway.
#
# ┌─ READ THIS BEFORE EDITING ─────────────────────────────────────────────┐
# │ The Hermes gateway stopped reading this file on 2026-07-14, when the   │
# │ local routing patch was replaced by upstream's native channel          │
# │ overrides. model_override / provider_override / system_prompt /        │
# │ tool_progress / free_response here change NOTHING at runtime.          │
# │                                                                        │
# │ To pin a channel's model, edit ~/.hermes/config.yaml:                  │
# │   platforms.<platform>.channel_overrides.<chat_id>.{model,provider}    │
# │ Mentions: <platform>.free_response_channels. Prompts:                  │
# │ <platform>.channel_prompts. Restart the gateway to apply.              │
# │                                                                        │
# │ The one field still consumed is receipt_model_override (Butler).       │
# │ The stale model pins below are kept only as history (2026-09-29 audit).│
# └────────────────────────────────────────────────────────────────────────┘
#
# Each key under `routes:` is a chat_id (Slack channel ID, WhatsApp JID, etc.).
#
# Route fields:
#   label:          Human-friendly name
#   platform:       slack | whatsapp | telegram | discord | ...
#   system_prompt:  DEAD for the gateway (see box above)
#   model_override: DEAD for the gateway (see box above)
#   receipt_model_override:
#                   "provider/model" — workspace-side override read by
#                   butler/process_receipt.py for the receipt OCR +
#                   perishable classifier LLM calls.  Hermes itself does
#                   not consume this field; the workspace reader is
#                   lib/channel_routes.get_receipt_model_override.
#   tool_progress:  DEAD for the gateway (see box above)
#   free_response:  DEAD for the gateway (see box above)

routes:
  "120363408580186875@g.us":
    label: "Creative Agent"
    platform: whatsapp
    model_override: "gpt-6-astra"
    provider_override: "openai-codex"
