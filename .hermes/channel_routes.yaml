# Channel Routes — per-channel routing configuration for Hermes gateway.
#
# Each key under `routes:` is a chat_id (Slack channel ID, WhatsApp JID, etc.).
# The gateway reads this file on each request (cached, auto-reloads on change).
#
# Supported route fields:
#   label:          Human-friendly name (for logging / debugging)
#   platform:       slack | whatsapp | telegram | discord | ...
#   system_prompt:  Injected as the ephemeral system prompt for this channel
#   model_override: "provider/model" — override the default model selection
#   receipt_model_override:
#                   "provider/model" — workspace-side override read by
#                   butler/process_receipt.py for the receipt OCR +
#                   perishable classifier LLM calls.  Hermes itself does
#                   not consume this field; the workspace reader is
#                   lib/channel_routes.get_receipt_model_override.
#   tool_progress:  "all" | "new" | "verbose" | "off" — per-channel override
#   free_response:  true — (Slack only) bypass mention requirement
#
# Platform-level defaults apply when a route doesn't specify a field.
# Secret channel IDs can also be set via SLACK_FREE_RESPONSE_CHANNELS env var.

routes:
  # ── WhatsApp groups ──────────────────────────────────────────────────
  "120363426060828527@g.us":
    label: "Chinese Tutor"
    platform: whatsapp
    model_override: "override-code/chinese-tutor"
    provider_override: "custom:override-code"
    system_prompt: >
      You are a Chinese language tutor. Before every reply, read
      ~/klaw-workspace/SOUL-tutor.md for the full tutor state machine
      and follow it exactly.

  "120363399398244268@g.us":
