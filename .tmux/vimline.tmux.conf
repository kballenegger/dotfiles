# This tmux statusbar config is a tmuxline.vim-style theme
# Updated for modern tmux (2.9+ / 3.x+) using *-style options.

##### Status bar basics
set -g status on
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Old:
#   status-bg, status-attr, status-left-attr, status-right-attr
# New: status-style handles bg + attributes for the whole status line
set -g status-style "bg=colour233,none"

##### Messages (old message-*, message-command-*)
# Old options removed:
#   message-bg/message-fg
#   message-command-bg/message-command-fg
# New:
#   message-style, message-command-style
set -g message-style "bg=colour236,fg=colour247"
set -g message-command-style "bg=colour236,fg=colour247"

##### Pane borders (old pane-*-border-fg)
# Old options removed:
#   pane-border-fg, pane-active-border-fg
# New:
#   pane-border-style, pane-active-border-style
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour148"

##### Window status (old window-status-*, *-bg/*-fg/*-attr)
# Old options removed:
#   window-status-fg/window-status-bg/window-status-attr
#   window-status-activity-*-*
# New:
#   window-status-style, window-status-current-style, window-status-activity-style
# Note: Your formats already specify colours; styles here act as sane defaults.
setw -g window-status-separator ""
setw -g window-status-style "bg=colour233,fg=colour231,none"
setw -g window-status-activity-style "bg=colour233,fg=colour148,none"
# Current window styling is typically done via the format, but setting a default is fine:
setw -g window-status-current-style "bg=colour236,fg=colour247,none"

##### Left / right content (kept as-is, just modern tmux-safe)
set -g status-left "#[fg=colour22,bg=colour148] #S #[fg=colour148,bg=colour233,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=colour236,bg=colour233,nobold,nounderscore,noitalics]#[fg=colour247,bg=colour236] %Y-%m-%d  %H:%M #[fg=colour148,bg=colour236,nobold,nounderscore,noitalics]#[fg=colour22,bg=colour148] #h "

##### Window formats (kept)
setw -g window-status-format "#[fg=colour231,bg=colour233] #I #[fg=colour231,bg=colour233] #W "
setw -g window-status-current-format "#[fg=colour233,bg=colour236,nobold,nounderscore,noitalics]#[fg=colour247,bg=colour236] #I #[fg=colour247,bg=colour236] #W #[fg=colour236,bg=colour233,nobold,nounderscore,noitalics]"
